# Equivalent mutants: no test can tell them apart from the original.
exclude_re = [
    # SplitMix64's last xor-shift only changes the low 31 bits; random::unit keeps the top 24.
    'random\.rs:7:\d+: replace \^ with \| in mix',
    # (a - n·T) % T and (a + n·T) % T are the same remainder.
    'session\.rs:\d+:\d+: replace - with \+ in Session::frame',
    # Only one rules version exists, so no replay can carry another one yet.
    'flappy-replay/src/lib\.rs:\d+:\d+: replace Replay::rules_version -> u32 with 1',
    # The sine of a phase kept within one turn, or not, or turning backwards, sounds the same.
    'sound\.rs:\d+:\d+: replace % with \+ in Tone::samples',
    'sound\.rs:\d+:\d+: replace \+ with - in Tone::samples',
]
