[workspace]
resolver = "3"
members = [
    "crates/flappy-core",
    "crates/flappy-replay",
    "crates/flappy-storage",
    "crates/flappy-web-storage",
    "crates/flappy-client",
    "crates/flappy-bench",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
flappy-core = { path = "crates/flappy-core" }
flappy-replay = { path = "crates/flappy-replay" }
flappy-storage = { path = "crates/flappy-storage" }
flappy-web-storage = { path = "crates/flappy-web-storage" }
serde = { version = "1.0.229", features = ["derive"] }
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }
serde_json = "1.0.154"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
