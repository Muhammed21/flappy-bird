[graph]
all-features = true

[advisories]
yanked = "deny"
# Accepted on 2026-11-17 (plans/architecture.md, "Risques acceptés"). Any other advisory fails CI.
ignore = [
    # macroquad: global mutable statics, use-after-free possible from safe code, no fix released.
    # Contained: single-threaded offline client, and only flappy-client depends on macroquad
    # (docs/layers.md), so replacing it never touches the game rules.
    { id = "RUSTSEC-2025-0035", reason = "macroquad unsound, no fix; contained to flappy-client, see plans/architecture.md" },
    # ttf-parser (via macroquad -> fontdue) is unmaintained; it only parses fonts we ship ourselves.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; parses only our own bundled fonts" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
